name: build-app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze npm
        run: npm install

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build Vite frontend
        run: npm run build

      - name: Compila l'app Windows
        run: npx tauri build

      - name: Carica l'installer Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze npm
        run: npm install

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installa dipendenze di sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build Vite frontend
        run: npm run build

      - name: Compila l'app Linux
        run: npx tauri build

      - name: Carica il pacchetto Debian
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Carica l'AppImage Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze npm
        run: npm install

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build Vite frontend
        run: npm run build

      - name: Compila l'app macOS
        run: npx tauri build

      - name: Carica il DMG macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze npm
        run: npm install

      - name: Installa Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
          key: rust-${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-android-

      - name: Inizializza progetto Android
        run: npx tauri android init

      - name: Build Vite frontend
        run: npm run build

      - name: Compila l'app Android
        run: npx tauri android build --configuration Release

      - name: Carica l'APK Android
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Scarica tutti gli artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lista file
        run: find artifacts -type f | head -50

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/*.exe
            artifacts/linux-deb/*.deb
            artifacts/linux-appimage/*.AppImage
            artifacts/macos/*.dmg
            artifacts/android/**/*.apk
