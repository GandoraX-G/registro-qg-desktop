name: ci

# Pipeline unica del progetto:
#  - quality   → gate su ogni push e pull request (build + test unitari + smoke)
#  - desktop   → pacchetti Tauri a matrice, solo su tag/dispatch (costano minuti)
#  - pages     → build PWA e pubblicazione su GitHub Pages, solo su main
#  - release   → GitHub Release con gli artifact desktop, solo su tag
#
# `npm test` si costruisce da solo la dist/ (script `pretest`), quindi non
# serve più l'ordine fragile test-prima-della-build che bloccava il deploy.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      # pretest compila dist/ con la configurazione di default: il test smoke
      # non dipende più da un artefatto preesistente.
      - name: Test (unitari + smoke)
        run: npm test

      - name: Verifica contratto UI (id del DOM usati dal JS)
        run: npm run test:ui-contract

  pages:
    name: build e deploy Pages
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Build PWA per Pages
        run: npm run build
        env:
          DEPLOY_PWA: 'true'

      - name: Verifica del build
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          grep -q '/registro-qg-desktop/manifest.json' dist/index.html
          if grep -qE 'user-scalable=no|maximum-scale=1' dist/index.html; then
            echo "::error::Lo zoom è bloccato nel viewport"
            exit 1
          fi
          if grep -rqE 'fonts\.(googleapis|gstatic)' dist; then
            echo "::error::Il build contiene font esterni"
            exit 1
          fi
          echo "index.html: $(stat -c%s dist/index.html) byte · asset: $(ls dist/assets | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Pubblica su GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  desktop:
    name: desktop (${{ matrix.os }})
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            bundles: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Installa dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Installa dipendenze npm
        run: npm ci

      - name: Compila l'app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Carica gli artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crea la release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
